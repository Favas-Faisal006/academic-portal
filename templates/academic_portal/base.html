<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College ERP Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Institutional ERP Core</a>
        <div class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
            <span class="nav-item nav-link text-white me-3">Welcome, {{ user.username }}</span>
            <a class="nav-link btn btn-sm btn-outline-light" href="{% url 'admin:logout' %}">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
